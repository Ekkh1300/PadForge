[workspace]
resolver = "2"
members = ["crates/padcore", "crates/padforge", "crates/padforge-installer"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/padforge/padforge"
authors = ["PadForge contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.12"
bytemuck = { version = "1.20", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"