[package]
name = "padcore"
description = "PadForge core engine: DualShock 4 input, XInput translation, profiles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "padcore"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
bytemuck.workspace = true

hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
# The notification feature is what carries force feedback: without it ViGEmBus
# accepts the virtual pad and never says what the game asked it to vibrate, so
# there is nothing to forward to the DualShock.
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # Drives the virtual pad the way a game would, which is the only way to ask
    # for force feedback and the only way to prove rumble end to end.
    "Win32_UI_Input_XboxController",
    # probe-output-caps asks the HID interface directly what a write must look
    # like, which hidapi does not expose.
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }